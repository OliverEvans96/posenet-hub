# Example config for run_synthetic_cameras.
# Subject is roughly at origin; pose CSV is in world coordinates.
# Cameras at various elevations, all looking at the subject (origin).

hub_url: "http://127.0.0.1:50051"
group_name: "synthetic"
pose_csv_path: "fake_poses/running_pose.csv"

# Optional: run for 60 seconds then exit. Omit to run until interrupted.
# duration_secs: 60

fps: 30
# Radians per second around Z axis (yaw). e.g. 0.1 ≈ 5.7°/s, 1.0 ≈ one full turn per 2π s
rotation_speed_rad_per_sec: 0.5

cameras:
  # Coordinates are in meters. Convention used here: world_up is +Z.
  # Place cameras like wall/ceiling mounts in a medium room, looking at the subject around chest height.
  # fov_deg is horizontal field-of-view in degrees.
  # Optional feed_path: path to an image or animated GIF to stream as this camera's feed
  # (cropped to calibration aspect ratio, e.g. 640x480). Omit for pose-only streaming.

  # Front-left (ceiling-ish corner)
  - name: "cam_front_left"
    position: [3.2, 3.0, 2.4]
    look_at: [0.0, 0.0, 1.0]
    fov_deg: 60
    # feed_path: "assets/smiley.png"  # optional: stream this image as camera feed

  # Front-right (ceiling-ish corner)
  - name: "cam_front_right"
    position: [-3.2, 3.0, 2.4]
    look_at: [0.0, 0.0, 1.0]
    fov_deg: 60

  # Back-left (high wall mount)
  - name: "cam_back_left"
    position: [3.0, -3.2, 2.1]
    look_at: [0.0, 0.0, 1.0]
    fov_deg: 60

  # Back-right (high wall mount)
  - name: "cam_back_right"
    position: [-3.0, -3.2, 2.1]
    look_at: [0.0, 0.0, 1.0]
    fov_deg: 60
