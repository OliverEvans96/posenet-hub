[package]
name = "posenet-vr-hub"
version = "0.1.0"
authors = ["Oliver Evans <oliverevans96@gmail.com>",
           "Timothy Wood <fishuyo@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
cxx = "1.0.44"
nalgebra = { version = "0.29.0", features=["rand"] }
generic-array = "0.14"
tonic = "0.5"
prost = "0.8"
prost-types = "0.8.0"
tokio = { version = "1.5", features=["rt-multi-thread", "macros", "time", "fs"] }
tokio-stream = "0.1.7"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
async-std = "1.9"
rand = "0.8"
structopt = "0.3.23"
log = "0.4.14"
env_logger = "0.9.0"
uuid = { version = "0.8.2", features=["v4"] }
dotenv = "0.15"
image = "0.23"
gif = "0.13"
serde = { version = "1.0", features=["derive"] }
serde_yaml = "0.8"
clap = { version = "3.1.16", features=["derive"] }
thiserror = "1.0"
parking_lot = "0.12"
csv = "1.1"
async-stream = "0.3"
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde_json = "1.0"
hyper = { version = "0.14", features = ["server", "http1"] }
percent-encoding = "2"

[build-dependencies]
tonic-build = "0.5"
cxx-build = "1.0"
dotenv = "0.15"

[dev-dependencies]
rstest = "0.11"
more-asserts = "0.2"
tempfile = "3.3"