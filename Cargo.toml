[package]
name = "posenet-vr-hub"
version = "0.1.0"
authors = ["Oliver Evans <oliverevans96@gmail.com>",
           "Timothy Wood <fishuyo@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cxx = "1.0.44"
nalgebra = { version = "0.29.0", features=["rand"] }
generic-array = "0.14"
tonic = "0.5"
prost = "0.8"
prost-types = "0.8.0"
tokio = { version = "1.5", features=["rt-multi-thread", "macros", "time"] }
tokio-stream = "0.1.7"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
async-std = "1.9"
rand = "0.8"
structopt = "0.3.23"
log = "0.4.14"
env_logger = "0.9.0"
uuid = { version = "0.8.2", features=["v4"] }
dotenv = "0.15"


[build-dependencies]
tonic-build = "0.5"
cxx-build = "1.0"
dotenv = "0.15"