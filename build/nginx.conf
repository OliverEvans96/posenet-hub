worker_processes  2;
user              www-data;

events {
    use           epoll;
    worker_connections  128;
}

http {
  server { # simple reverse-proxy
    listen       80;
    server_name  posenet-hub-docs.nrp-nautilus.io;

    location / {
      root /var/www;
      include  /etc/nginx/mime.types;
      rewrite ^/$ posenet_vr_hub/index.html redirect;
    }
  }
}
